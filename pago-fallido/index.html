<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pago no procesado — NavRule</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% -10%,#173a5e 0%,#0d2137 55%,#091c2e 100%);padding:24px}
.card{background:#fff;border-radius:16px;padding:44px 38px;max-width:420px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.ico{width:64px;height:64px;border-radius:50%;background:#fdeee6;display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
h1{font-size:19px;font-weight:800;color:#0d2137;margin-bottom:10px}
p{font-size:13.5px;color:#5a6a7e;margin-bottom:26px;line-height:1.5}
.btn{display:inline-block;background:#ff6b1a;color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:13px 26px;border-radius:8px}
.btn:hover{background:#e85f14}
.foot{margin-top:22px;font-size:11px;color:#b7c0cc}
</style>
</head>
<body>
<div class="card">
  <div class="ico"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#cc3333" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
  <h1>El pago no se pudo procesar</h1>
  <p>No se completó el pago. No se te realizó ningún cargo. Podés volver a intentarlo cuando quieras.</p>
  <a class="btn" href="/app">Volver a intentar</a>
  <div class="foot">NavRule © 2026</div>
</div>
</body>
</html>
